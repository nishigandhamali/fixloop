name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm exec prisma generate
      - name: Start embedded PostgreSQL
        run: |
          nohup pnpm db:start > db.log 2>&1 &
          for i in $(seq 1 60); do grep -q "postgres ready" db.log && exit 0; sleep 1; done
          cat db.log; exit 1
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
